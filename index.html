<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Testlar</title>
<meta name="theme-color" content="#0F6B5F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F2; --card:#FFFFFF; --ink:#16302C; --muted:#5E716D; --line:#D5E0DD;
  --accent:#0F6B5F; --accent-ink:#FFFFFF; --soft:#DCEBE7;
  --ok:#1D8A4C; --ok-bg:#E3F4EA; --bad:#C53A2E; --bad-bg:#FBE7E4; --empty:#C9D6D3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0F1A18; --card:#172623; --ink:#E4EFEC; --muted:#93A8A3; --line:#28403B;
  --accent:#3DBBA7; --accent-ink:#06211D; --soft:#1F3632;
  --ok:#4CC47F; --ok-bg:#163327; --bad:#F07467; --bad-bg:#3A1C19; --empty:#2D4440; }}
:root[data-theme="dark"]{
  --bg:#0F1A18; --card:#172623; --ink:#E4EFEC; --muted:#93A8A3; --line:#28403B;
  --accent:#3DBBA7; --accent-ink:#06211D; --soft:#1F3632;
  --ok:#4CC47F; --ok-bg:#163327; --bad:#F07467; --bad-bg:#3A1C19; --empty:#2D4440; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.65rem;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin:8px 0 6px}
h2{font-size:1.05rem;font-weight:700;margin:26px 0 10px}
p{margin:0}
.sub{color:var(--muted);font-size:.95rem}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.modes{display:grid;gap:10px;margin-top:18px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-radius:16px;padding:14px 16px;min-height:72px}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.mode[disabled]{opacity:.45;cursor:default}
.mode b{display:block;font-size:1.02rem}
.mode span{color:var(--muted);font-size:.88rem;line-height:1.35}
.ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:1.25rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:.92rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{opacity:.7;margin-left:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:.95rem}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.primary{display:block;width:100%;margin-top:26px;background:var(--accent);color:var(--accent-ink);
  border-radius:14px;padding:16px;font-weight:700;font-size:1.05rem}
.primary[disabled]{opacity:.4}
.ghost{display:block;width:100%;margin-top:10px;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-weight:600;background:var(--card)}
.stats{display:flex;gap:10px;margin-top:16px}
.stat{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:1.3rem;font-weight:800}
.stat span{font-size:.8rem;color:var(--muted)}
/* quiz */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 12px;margin:-20px 0 8px}
.topbar{display:flex;align-items:center;gap:10px}
.x{width:40px;height:40px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:1.2rem;line-height:1}
.counter{font-weight:700;font-variant-numeric:tabular-nums}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.timer.low{color:var(--bad)}
/* blister strip */
.blister{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px;padding:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px}
.pill{width:16px;height:9px;border-radius:5px;background:var(--empty);transition:background .2s}
.pill.ok{background:var(--ok)} .pill.bad{background:var(--bad)} .pill.done{background:var(--accent)}
.pill.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.topic{font-size:.82rem;color:var(--accent);font-weight:600;margin-top:6px}
.q{font-size:1.2rem;font-weight:700;line-height:1.35;margin:6px 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-radius:14px;padding:13px 14px;min-height:56px;line-height:1.35}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)} .opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600}
.fb.ok{background:var(--ok-bg);color:var(--ok)} .fb.bad{background:var(--bad-bg);color:var(--bad)}
/* result */
.score{font-size:4.5rem;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:20px}
.grade{display:inline-block;margin-top:10px;padding:6px 14px;border-radius:999px;background:var(--soft);font-weight:700}
.review{margin-top:8px;display:grid;gap:10px}
.ri{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.95rem}
.ri p{font-weight:600;margin-bottom:6px}
.ri .y{color:var(--bad)} .ri .c{color:var(--ok)}
.foot{margin-top:28px;font-size:.8rem;color:var(--muted);text-align:center}
.link{color:var(--muted);text-decoration:underline;font-size:.85rem;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.lock{text-align:left}
.idbox{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;background:var(--card);border:1.5px dashed var(--accent);border-radius:14px;padding:14px 16px}
.idbox b{font-size:1.6rem;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.small{font-size:.85rem;color:var(--muted);margin-top:8px}
.copy{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;background:var(--bg);font-size:.9rem}
.tg{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;margin-top:16px;background:#229ED9;color:#fff;border-radius:14px;padding:15px;font-weight:700}
.field{display:block;width:100%;margin-top:10px;font:inherit;font-size:1.4rem;letter-spacing:.12em;text-align:center;text-transform:uppercase;
  padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.field:focus{outline:3px solid var(--accent);outline-offset:1px}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.steps{margin:14px 0 0;padding-left:20px;color:var(--ink)} .steps li{margin:4px 0}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--accent);padding:6px 0}
.install{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="lic.js"></script>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
